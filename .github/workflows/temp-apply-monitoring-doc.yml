name: Temporary apply monitoring doc

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-apply-monitoring-doc.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply update on owasp_top10
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin owasp_top10
          git checkout -B owasp_top10 origin/owasp_top10
          python3 update_monitoring_section.py
          rm -f update_monitoring_section.py .github/workflows/apply-monitoring-doc-update.yml
          git add -A
          git commit -m "docs: update Grafana section to current applied state"
          git push origin HEAD:owasp_top10
      - name: Remove temporary workflow from main
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/temp-apply-monitoring-doc.yml
          git add -A
          git commit -m "chore: remove temporary monitoring doc workflow"
          git push origin main
