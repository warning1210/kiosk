name: Temporary apply monitoring doc

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-apply-monitoring-doc.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update owasp_top10 HTML
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin owasp_top10
          git checkout -B owasp_top10 origin/owasp_top10
          SECTION_B64='매니저 " 
          SECTION_B64="$SECTION_B64" python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('kiosk_보안_OWASP_2025_Top10.html')
          s=p.read_text(encoding='utf-8')
          a='            <!-- ===================== 향후 계획: EC2 + Grafana 모니터링 ===================== -->'
          b='            <dialog class="image-lightbox"'
          i=s.index(a); j=s.index(b,i)
          section=base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          p.write_text(s[:i]+section+s[j:],encoding='utf-8')
          PY
          rm -f .github/workflows/apply-monitoring-doc-update.yml
          git add kiosk_보안_OWASP_2025_Top10.html .github/workflows/apply-monitoring-doc-update.yml
          git commit -m "docs: update Grafana section to current applied state"
          git push origin HEAD:owasp_top10
      - name: Remove temporary workflow from main
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/temp-apply-monitoring-doc.yml
          git add -A
          git commit -m "chore: remove temporary monitoring doc workflow"
          git push origin main
