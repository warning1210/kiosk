# BACKEND_HOST는 배포 시 EC2 내부 IP로 치환한다 (docker run --add-host 또는 envsubst로 주입).
# 로컬 vite.config.js의 server.proxy와 동일한 역할 - /api, /uploads만 백엔드로 넘기고 나머지는 SPA 정적 파일.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더 스캐너가 지적한 6개 헤더. location들이 add_header를 따로 안 쓰므로
    # server 레벨에 한 번만 선언해도 전부 상속된다(location에 add_header가 하나라도
    # 생기면 그 location은 상위 걸 상속 안 받으니 그때는 같이 복사해야 함, 지금은 해당 없음).
    # HSTS: 지금 이 서버는 80 포트만 열려있어 당장은 무의미하지만, HTTPS 앞단(ALB/CloudFront 등)이
    # 붙는 순간 바로 유효해지도록 미리 켜둔다. preload는 브라우저 목록에 영구 등록에 가까운 조치라
    # 별도 논의 없이는 넣지 않는다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 이 프로젝트가 실제로 붙는 외부 출처만 허용한다: Turnstile(캡차), Toss Payments(결제),
    # Firebase Auth(로그인), 카카오 우편번호 검색(지점 가입 폼). style-src에 unsafe-inline이
    # 필요한 이유는 여러 화면에서 style="..." 인라인 속성을 실제로 쓰고 있어서(예: BranchLoginView).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://js.tosspayments.com https://t1.kakaocdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://api.tosspayments.com https://*.tosspayments.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseapp.com https://*.googleapis.com; frame-src https://challenges.cloudflare.com https://*.tosspayments.com https://postcode.map.daum.net; form-action 'self' https://*.tosspayments.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;

    # SSE 스트림(지점 대시보드 실시간 알림) 전용 - 일반 location보다 먼저 매칭돼야 한다.
    # nginx는 기본적으로 업스트림 응답을 다 모았다가 흘려보내는데(proxy_buffering),
    # 이 연결은 끝나지 않는 스트림이라 버퍼링을 켜두면 이벤트가 영영 클라이언트로 안 나간다.
    # proxy_read_timeout도 기본 60초라 유휴 상태면 중간에 끊기므로 넉넉하게 늘린다
    # (백엔드가 25초마다 ping을 보내 이 타임아웃보다 훨씬 자주 갱신하긴 하지만, 여유를 둔다).
    location /api/branch/events/ {
        proxy_pass http://${BACKEND_HOST}:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://${BACKEND_HOST}:8080;
        proxy_set_header Host $host;
    }

    # Vue Router(createWebHistory) - 새로고침 시 /branch/dashboard 같은 경로가 404 나지 않도록 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
