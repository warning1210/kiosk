spring.application.name=kiosk-sim

server.port=18080
server.address=0.0.0.0

spring.datasource.url=jdbc:h2:mem:kioskdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Toss Payments
toss.payments.api.url=https://api.tosspayments.com
toss.payments.client.key=test_ck_integration
toss.payments.secret.key=test_sk_integration_dummy_key_do_not_use_in_production
toss.payments.success.url=http://localhost:5174/payment/success
toss.payments.fail.url=http://localhost:5174/payment/fail
toss.payments.qr.timeout=300
