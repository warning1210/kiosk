server:
  port: 8080

spring:
  application:
    name: kiosk-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_boolean_jdbc_type: TINYINT
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH}
