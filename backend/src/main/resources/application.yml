server:
  port: 8080

spring:
  application:
    name: kiosk-backend

  datasource:
    # DB_HOST를 팀원 각자의 접속 대상(호스트를 공유하는 팀원의 IP 등)으로 오버라이드해서 사용
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:kiosk}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:kiosk}
    password: ${DB_PASSWORD:kiosk1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # schema is created by db/init/01-schema.sql via docker-compose; keep Hibernate from altering it
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        # DDL은 관례상 boolean 컬럼도 tinyint(1)로 선언했는데, Hibernate 6 기본값은 Boolean을 bit로
        # 기대해서 스키마 검증이 깨짐 -> tinyint를 선호하도록 명시
        type:
          preferred_boolean_jdbc_type: TINYINT
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
