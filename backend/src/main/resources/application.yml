server:
  port: 8080

spring:
  application:
    name: kiosk-backend

  datasource:
    # DB_HOST를 팀원 각자의 접속 대상(호스트를 공유하는 팀원의 IP 등)으로 오버라이드해서 사용
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:kiosk}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:kiosk}
    password: ${DB_PASSWORD:kiosk1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # schema is created by db/init/01-schema.sql via docker-compose; keep Hibernate from altering it
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
