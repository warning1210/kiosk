server:
  port: 8080

spring:
  config:
    # Local development secrets. The file is optional and excluded from Git.
    # OS/container environment variables with the same names take precedence.
    import: optional:file:./.env[.properties]

  application:
    name: kiosk-backend

  datasource:

    # DB_HOST를 팀원 각자의 접속 대상(호스트를 공유하는 팀원의 IP 등)으로 오버라이드해서 사용

    # DB_HOST를 팀원 각자의 접속 대상 IP 또는 호스트명으로 덮어써서 사용한다.

    url: jdbc:mysql://${DB_HOST:3.35.218.189}:${DB_PORT:3307}/${DB_NAME:kiosk}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:kiosk}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # SMTP 서버를 이용해 지점 초대 메일을 발송한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatisConfig.java에도 동일한 설정이 있어 IDE가 YAML을 잘못 저장하더라도
# Mapper XML 등록이 누락되지 않는다.
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kiosk.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    call-setters-on-nulls: true

app:
  # 초대 이메일에 들어갈 프론트엔드 주소다.
  frontend:
    base-url: ${APP_FRONTEND_URL:http://localhost:5173}

  # MAIL_ENABLED=true일 때만 실제 이메일을 발송한다.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

  upload:
    dir: uploads

# 관리자 토큰 HMAC 서명 키다. 운영 환경별로 서로 다른 32바이트 이상의 무작위 값을 사용한다.
# 기본값을 두지 않아 키가 누락된 서버는 안전하게 기동을 중단한다.
hq:
  token-secret: ${HQ_TOKEN_SECRET:}

# Firebase 인증을 로컬에서 테스트하려면 본인의 인증 파일 경로를
# FIREBASE_CREDENTIALS_PATH 환경변수로 지정한다. 비어 있으면 초기화를 건너뛴다.
firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

# MyBatis SQL 로그가 필요하면 아래 패키지 로그 수준을 debug로 유지한다.
logging:
  level:

    org.hibernate.SQL: debug
    com.zaxxer.hikari: DEBUG
    org.springframework.boot.context.config: DEBUG

    com.kiosk.domain: debug

# 영수증 프린터 서비스 주소다. 프린터 연결에 실패해도 주문과 결제는 유지된다.
printer:
  url: ${PRINTER_URL:http://172.16.15.97:7777/receipt}

# 토스페이먼츠 키는 개발자센터에서 발급받아 환경변수로만 주입한다.
# 저장소에 노출됐던 테스트 키는 폐기하고 재발급한 키를 사용해야 한다.
toss:
  secret-key: ${TOSS_SECRET_KEY:}
  client-key: ${TOSS_CLIENT_KEY:}
  api-base-url: https://api.tosspayments.com
  success-url: ${TOSS_SUCCESS_URL:}
  fail-url: ${TOSS_FAIL_URL:}

# 지점 및 본사 로그인 캡차의 서버 검증용 시크릿 키다.
turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:}

# 고객 전화번호를 평문으로 저장하지 않기 위한 조회용 해시 키다. 32바이트 이상이어야 하며
# 기본값을 두지 않아 누락되면 서버가 기동을 중단한다. 화면 표시용 원본 복원은 안 하므로
# (MobileNumberCrypto.mask() 참고) 암호화 키는 별도로 없다.
mobile-number:
  hash-secret: ${MOBILE_NUMBER_HASH_SECRET:}
