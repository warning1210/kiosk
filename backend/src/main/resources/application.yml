server:
  port: 8080

spring:
  application:
    name: kiosk-backend

  datasource:
    # DB_HOST를 팀원 각자의 접속 대상(호스트를 공유하는 팀원의 IP 등)으로 오버라이드해서 사용
    url: jdbc:mysql://${DB_HOST:13.125.213.12}:${DB_PORT:3307}/${DB_NAME:kiosk}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:kiosk}
    password: ${DB_PASSWORD:kiosk6578}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # schema is created by db/init/01-schema.sql via docker-compose; keep Hibernate from altering it
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        # DB의 boolean 플래그 컬럼들이 전부 tinyint로 선언되어 있어서,
        # Hibernate의 기본 Boolean->bit 매핑과 어긋나 스키마 검증이 계속 실패함.
        # 이 옵션으로 Boolean 필드 전체를 tinyint 기준으로 매핑하도록 통일.
        type:
          preferred_boolean_jdbc_type: TINYINT
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload:
    dir: uploads

firebase:
  credentials:
    path: "C:/Users/dldyd/Downloads/firebase.json"

logging:
  level:
    org.hibernate.SQL: debug

# 영수증 프린터 서비스 주소 (강사님 PC에서 도는 서비스)
