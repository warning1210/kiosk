server:
  port: 8080

spring:
  application:
    name: kiosk-backend

  datasource:
    # DB_HOST를 팀원 각자의 접속 대상(호스트를 공유하는 팀원의 IP 등)으로 오버라이드해서 사용
    url: jdbc:mysql://${DB_HOST:3.35.218.189}:${DB_PORT:3307}/${DB_NAME:kiosk}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:kiosk}
    password: ${DB_PASSWORD:kiosk6578}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # schema is created by db/init/01-schema.sql via docker-compose; keep Hibernate from altering it
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        # DB의 boolean 플래그 컬럼들이 전부 tinyint로 선언되어 있어서,
        # Hibernate의 기본 Boolean->bit 매핑과 어긋나 스키마 검증이 계속 실패함.
        # 이 옵션으로 Boolean 필드 전체를 tinyint 기준으로 매핑하도록 통일.
        type:
          preferred_boolean_jdbc_type: TINYINT
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Gmail 등 SMTP 서버를 이용해 지점 초대 메일을 발송한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # 이메일에 들어갈 프론트 주소이며 다른 PC에서 열 수 있는 IP 또는 운영 도메인을 사용한다.
  frontend:
    base-url: ${APP_FRONTEND_URL:http://localhost:5173}
  # MAIL_ENABLED=true일 때만 실제 메일을 보내 개발 환경의 설정 오류를 방지한다.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  upload:
    dir: uploads

# 팀원 각자의 로컬 경로를 하드코딩하면 다른 사람 컴퓨터에선 파일이 없어 Firebase 초기화가 예외를 던지고
# 스프링 컨텍스트 전체가 기동 실패한다(FirebaseConfig는 원래 경로가 비어있을 때만 안전하게 건너뛴다).
# 지점 로그인(Firebase)을 로컬에서 테스트하려면 FIREBASE_CREDENTIALS_PATH 환경변수로 본인 파일 경로를 지정할 것.
firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}


logging:
  level:
    org.hibernate.SQL: debug

# 영수증 프린터 서비스 주소 (강사님 PC에서 도는 서비스)
# 실습실 기본값은 강사님 PC(172.16.15.97:8888). 다른 환경에서는 환경변수 PRINTER_URL로 교체.
#   집에서 테스트: PRINTER_URL=http://localhost:8888/receipt  (프린터 서비스를 로컬에 띄운 경우)
#   프린터 없이 개발: 그냥 두면 됨 - 연결 실패해도 주문/결제는 정상, 영수증은 화면으로만 표시
printer:
  url: ${PRINTER_URL:http://172.16.15.97:7777/receipt}

# 토스페이먼츠 - 기본값은 테스트 키라 실제 결제망을 타지 않음.
# 실 서비스로 전환할 땐 코드 안 고치고 아래 환경변수만 라이브 키로 교체.
# success-url/fail-url을 비워두면 TossPaymentsProperties가 이 서버 PC의 LAN IP를 자동으로 잡아서 쓴다.
# 공인 도메인(ngrok 등)으로 데모할 땐 TOSS_SUCCESS_URL/TOSS_FAIL_URL 환경변수로 직접 지정할 것.
toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_LlDJaYngroawzQAvQJ9l3ezGdRpX}
  client-key: ${TOSS_CLIENT_KEY:test_ck_Gv6LjeKD8aXOdnl1lpYkrwYxAdXy}
  api-base-url: https://api.tosspayments.com
  success-url: ${TOSS_SUCCESS_URL:}
  fail-url: ${TOSS_FAIL_URL:}

# Cloudflare Turnstile - 지점/본사 로그인 캡차의 서버 검증용 시크릿 키.
# 프론트 sitekey(BranchLoginView.vue)와 Cloudflare 대시보드에서 짝을 이루는 값이라,
# 비어있거나 안 맞으면 로그인 자체가 항상 실패 처리된다 (fail-closed).
turnstile:
  secret-key: 0x4AAAAAAECTZFMy_NgnHahTGnjTyVEu79o
